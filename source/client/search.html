<!doctype html>
<html lang="en">

<head>
    <!-- Defines the character encoding used by the page -->
    <meta charset="utf-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <!-- Sets the title shown in the browser tab -->
    <title>Explore scholarship and school support | Bright Path</title>

    <!-- Defines the website favicon -->
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <!-- Defines the image used when the page is shared -->
    <meta property="og:image" content="/assets/og.jpg">

    <!-- Loads the shared, search page and theme stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/theme-d-scholarship.css">
</head>

<body>
    <!-- Allows keyboard users to skip directly to the main content -->
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Contains the website header and main navigation -->
    <header class="site-header">
        <nav class="nav container" aria-label="Main navigation">
            <!-- Website logo and link to the home page -->
            <a class="brand" href="index.html">
                <span class="brand-mark">
                    <img src="/assets/logo.svg" alt="" width="160" height="40">
                </span>
                Bright Path
            </a>

            <!-- Navigation link to the home page -->
            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>
        </nav>
    </header>

    <!-- Contains the main content of the search page -->
    <main id="main">

        <!-- Contains the search form and event results -->
        <section class="catalogue">
            <div class="container">

                <!-- Introduces the event search section -->
                <div class="catalogue-head">
                    <span class="eyebrow">Find your programme</span>
                    <h1>Scholarship catalogue</h1>
                    <p>Filter upcoming opportunities by place, category or keyword.</p>

                    <!-- Allows users to search and filter events -->
                    <form id="search-form" class="catalogue-bar" role="search">

                        <!-- Accepts a keyword used to search event titles -->
                        <div class="field">
                            <label for="keyword">Keyword</label>
                            <input id="keyword" name="keyword"
                                placeholder="Scholarship, supplies, tutoring…">
                        </div>

                        <!-- Allows the user to select an event category -->
                        <div class="field">
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value="">All categories</option>
                                <option value="Tutoring">Tutoring</option>
                                <option value="Reading">Reading</option>
                                <option value="Supplies">Supplies</option>
                                <option value="Scholarship">Scholarship</option>
                            </select>
                        </div>

                        <!-- Allows the user to select an event date -->
                        <div class="field">
                            <label for="date">Date</label>
                            <input id="date" name="date" type="date">
                        </div>

                        <!-- Accepts a city or venue used to filter events -->
                        <div class="field">
                            <label for="location">Location</label>
                            <input id="location" name="location"
                                placeholder="City or venue">
                        </div>

                        <!-- Clears all values in the search form -->
                        <button class="button secondary" id="clear"
                            type="reset">Clear</button>

                        <!-- Submits the search form -->
                        <button class="button" type="submit">Search</button>
                    </form>
                </div>

                <!-- Displays the number of results and a link to the home page -->
                <div class="results-header">
                    <!-- JavaScript updates this heading with the result count -->
                    <h2 id="result-count">Loading…</h2>
                    <a href="index.html">Back home</a>
                </div>

                <!-- JavaScript will place the matching event cards inside this container -->
                <div id="results" class="catalogue-grid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <!-- Loads shared JavaScript functions -->
    <script src="js/app.js"></script>

    <!-- Loads the JavaScript used to search and display events -->
    <script src="js/search.js"></script>
</body>

</html>
